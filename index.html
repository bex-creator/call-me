<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WebRTC Communication App</title>
    
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PeerJS for WebRTC signaling -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Tone.js for audio feedback -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #000000;
            color: #ffffff;
            touch-action: manipulation;
        }

        /* Numpad button active state */
        .numpad-btn {
            transition: all 0.15s ease;
        }
        .numpad-btn:hover {
            box-shadow: 0 0 15px rgba(255,255,255,0.05) inset;
        }
        .numpad-btn:active {
            background-color: #262626 !important;
            transform: scale(0.95);
        }

        /* Radar pulse animation for active calls */
        @keyframes radar {
            0% { transform: scale(0.8); opacity: 0.8; }
            100% { transform: scale(2.5); opacity: 0; }
        }
        
        .animate-radar::before, .animate-radar::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background-color: rgba(16, 185, 129, 0.4); /* Emerald 500 */
            z-index: -1;
        }
        
        .animate-radar::before {
            animation: radar 2s linear infinite;
        }
        
        .animate-radar::after {
            animation: radar 2s linear 1s infinite;
        }

        /* Ringing Animation for outgoing */
        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(96, 165, 250, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(96, 165, 250, 0); }
            100% { box-shadow: 0 0 0 0 rgba(96, 165, 250, 0); }
        }
        .animate-ringing {
            animation: pulse-ring 2s infinite;
        }

        /* Toast Animations */
        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .toast-enter { animation: slideInRight 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        
        /* Audio Visualizer Pulse */
        .audio-pulse {
            transition: transform 0.05s ease-out, box-shadow 0.1s ease-out, border-color 0.1s ease-out;
        }

        /* Custom Scrollbar */
        .custom-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: #404040;
            border-radius: 10px;
        }
        .custom-scroll::-webkit-scrollbar-thumb:hover {
            background: #525252;
        }
    </style>
</head>
<body class="h-screen w-full flex overflow-hidden bg-black text-white">

    <div id="splash-screen" class="fixed inset-0 z-50 bg-black/90 backdrop-blur-md flex flex-col items-center justify-center p-4 transition-opacity duration-500">
        <div class="w-20 h-20 bg-gradient-to-br from-blue-600 to-indigo-700 text-white rounded-2xl flex items-center justify-center mb-6 shadow-[0_0_30px_rgba(37,99,235,0.2)] animate-pulse">
            <i class="ph-fill ph-phone-call text-4xl"></i>
        </div>
        <h1 class="text-3xl font-bold text-white mb-3 tracking-tight">CommWeb</h1>

            <i id="splash-icon" class="ph-bold ph-spinner animate-spin text-xl"></i>

        </div>
    </div>

    <aside id="sidebar" class="w-full md:w-[380px] flex-shrink-0 bg-black border-r border-neutral-900 flex flex-col h-full hidden md:flex transition-all z-20 relative">

                </div>
                <span class="font-extrabold text-white text-xl tracking-tight">CommWeb</span>
                
                <!-- Mobile Close Sidebar Btn -->

            </div>

            <!-- Profile Card -->

                    <div class="flex items-center gap-3">
                        <div class="w-12 h-12 bg-neutral-800 rounded-full flex items-center justify-center">
                            <i class="ph-fill ph-user text-2xl text-neutral-400"></i>
                        </div>
                        <div>

                        </div>
                    </div>
                    <button id="edit-profile-btn" class="text-neutral-500 hover:text-white hover:bg-neutral-800 p-2 rounded-lg transition-all" title="Edit Profile">

                    </div>
                    <button id="copy-number-btn" class="p-2.5 text-neutral-400 hover:text-white bg-neutral-800 hover:bg-neutral-700 rounded-xl transition-all" title="Copy Number">

                </div>
            </div>
        </div>

        <!-- Contacts Section -->
        <div class="flex-1 flex flex-col overflow-hidden bg-black">
            <div class="px-6 py-5 flex justify-between items-center border-b border-neutral-900 bg-black sticky top-0 z-10">
                <h3 class="font-bold text-white text-lg flex items-center gap-2">

            </div>
        </div>

        <!-- Add Contact Modal (Inline overlay) -->

            </div>
            
            <div class="p-6 space-y-5">

                </div>

                </div>
                <button id="save-contact-btn" class="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-semibold mt-4 transition-all flex justify-center items-center gap-2">
                    <i class="ph-bold ph-check"></i> Save Contact

        </div>

        <!-- Edit Profile Modal (Inline overlay) -->
        <div id="edit-profile-form" class="absolute inset-0 bg-black/95 backdrop-blur-md z-30 flex flex-col hidden transition-opacity duration-300 opacity-0 text-white">
            <div class="p-6 border-b border-neutral-900 flex items-center">
                <button id="cancel-edit-profile" class="w-10 h-10 rounded-full bg-neutral-900 text-neutral-400 hover:bg-neutral-800 hover:text-white flex items-center justify-center mr-4 transition-colors">
                    <i class="ph-bold ph-arrow-left text-lg"></i>
                </button>
                <h3 class="font-bold text-white text-xl">Edit Profile</h3>
            </div>
            
            <div class="p-6 space-y-5">
                <div class="flex justify-center mb-6">
                    <div class="w-24 h-24 bg-neutral-900 rounded-full flex items-center justify-center border border-neutral-800">
                        <i class="ph-fill ph-user text-4xl text-neutral-500"></i>
                    </div>
                </div>
                <div>

                    <input type="text" id="edit-name-input" class="w-full bg-neutral-900 text-white px-4 py-3.5 rounded-xl border border-neutral-800 focus:border-blue-500 focus:ring-4 focus:ring-blue-500/20 focus:outline-none transition-all text-lg" placeholder="Your Name">
                </div>
                <button id="save-profile-btn" class="w-full py-4 bg-white text-black hover:bg-neutral-200 rounded-xl font-bold mt-4 transition-all flex justify-center items-center gap-2 text-lg">
                    Update Profile
                </button>
            </div>
        </div>

        <!-- Voicemails Modal (Inline overlay) -->
        <div id="voicemails-form" class="absolute inset-0 bg-black/95 backdrop-blur-md z-30 flex flex-col hidden transition-opacity duration-300 opacity-0 text-white">
            <div class="p-6 border-b border-neutral-900 flex items-center">
                <button id="cancel-voicemails" class="w-10 h-10 rounded-full bg-neutral-900 text-neutral-400 hover:bg-neutral-800 hover:text-white flex items-center justify-center mr-4 transition-colors">
                    <i class="ph-bold ph-arrow-left text-lg"></i>
                </button>

            </div>
            
            <div id="voicemails-list" class="flex-1 overflow-y-auto custom-scroll p-4 space-y-3">
                <!-- Voicemails rendered here -->
            </div>
        </div>
    </aside>

    <main class="flex-1 bg-black relative flex flex-col h-full w-full">
        <audio id="remote-audio" autoplay playsinline></audio>
        
        <!-- Mobile Top Bar -->
        <div class="md:hidden flex items-center justify-between p-4 border-b border-neutral-900 bg-black sticky top-0 z-10">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 bg-gradient-to-br from-blue-600 to-indigo-700 rounded-lg flex items-center justify-center text-white">
                    <i class="ph-fill ph-phone"></i>
                </div>
                <span class="font-extrabold text-white">CommWeb</span>
            </div>
            <button id="mobile-menu-btn" class="p-2 text-neutral-400 hover:text-white hover:bg-neutral-900 rounded-xl transition-colors">
                <i class="ph-bold ph-list text-2xl"></i>
            </button>
        </div>

        <!-- The Dialer View -->
        <div id="dialer-view" class="flex-1 flex flex-col items-center justify-center p-6 transition-all duration-500 transform">
            <div class="w-full max-w-sm flex flex-col items-center bg-neutral-950 p-8 md:p-10 rounded-[2.5rem] border border-neutral-900 shadow-[0_0_50px_rgba(0,0,0,0.5)]">
                
                <h2 class="text-neutral-500 font-semibold text-sm uppercase tracking-widest mb-2">Make a Call</h2>

                <!-- Smart Contact Display -->
                <div id="dialer-contact-label" class="h-6 mb-4 text-emerald-400 font-bold text-sm tracking-widest uppercase opacity-0 transition-opacity text-center w-full truncate px-4"></div>

                <!-- Display -->
                <div class="w-full bg-black border border-neutral-800 rounded-2xl h-24 flex items-center justify-center mb-8 relative overflow-hidden group shadow-[inset_0_0_20px_rgba(255,255,255,0.02)]">
                    <input type="text" id="dial-input" readonly class="bg-transparent text-center text-4xl md:text-5xl font-bold text-white w-full outline-none tracking-[0.15em] placeholder-neutral-700 relative z-10" placeholder="000 000">
                </div>
                
                <!-- Modern Numpad -->
                <div class="grid grid-cols-3 gap-4 md:gap-5 mb-8 w-full">
                    <button class="numpad-btn bg-neutral-900 border border-neutral-800 text-white text-3xl font-medium rounded-2xl aspect-square flex flex-col items-center justify-center hover:bg-neutral-800 hover:border-neutral-700 transition-all active:scale-95" onclick="appendNumber('1')">1</button>
                    <button class="numpad-btn bg-neutral-900 border border-neutral-800 text-white text-3xl font-medium rounded-2xl aspect-square flex flex-col items-center justify-center hover:bg-neutral-800 hover:border-neutral-700 transition-all active:scale-95" onclick="appendNumber('2')">2<span class="text-[9px] text-neutral-500 mt-0.5 tracking-widest uppercase font-semibold">ABC</span></button>
                    <button class="numpad-btn bg-neutral-900 border border-neutral-800 text-white text-3xl font-medium rounded-2xl aspect-square flex flex-col items-center justify-center hover:bg-neutral-800 hover:border-neutral-700 transition-all active:scale-95" onclick="appendNumber('3')">3<span class="text-[9px] text-neutral-500 mt-0.5 tracking-widest uppercase font-semibold">DEF</span></button>
                    <button class="numpad-btn bg-neutral-900 border border-neutral-800 text-white text-3xl font-medium rounded-2xl aspect-square flex flex-col items-center justify-center hover:bg-neutral-800 hover:border-neutral-700 transition-all active:scale-95" onclick="appendNumber('4')">4<span class="text-[9px] text-neutral-500 mt-0.5 tracking-widest uppercase font-semibold">GHI</span></button>
                    <button class="numpad-btn bg-neutral-900 border border-neutral-800 text-white text-3xl font-medium rounded-2xl aspect-square flex flex-col items-center justify-center hover:bg-neutral-800 hover:border-neutral-700 transition-all active:scale-95" onclick="appendNumber('5')">5<span class="text-[9px] text-neutral-500 mt-0.5 tracking-widest uppercase font-semibold">JKL</span></button>
                    <button class="numpad-btn bg-neutral-900 border border-neutral-800 text-white text-3xl font-medium rounded-2xl aspect-square flex flex-col items-center justify-center hover:bg-neutral-800 hover:border-neutral-700 transition-all active:scale-95" onclick="appendNumber('6')">6<span class="text-[9px] text-neutral-500 mt-0.5 tracking-widest uppercase font-semibold">MNO</span></button>
                    <button class="numpad-btn bg-neutral-900 border border-neutral-800 text-white text-3xl font-medium rounded-2xl aspect-square flex flex-col items-center justify-center hover:bg-neutral-800 hover:border-neutral-700 transition-all active:scale-95" onclick="appendNumber('7')">7<span class="text-[9px] text-neutral-500 mt-0.5 tracking-widest uppercase font-semibold">PQRS</span></button>
                    <button class="numpad-btn bg-neutral-900 border border-neutral-800 text-white text-3xl font-medium rounded-2xl aspect-square flex flex-col items-center justify-center hover:bg-neutral-800 hover:border-neutral-700 transition-all active:scale-95" onclick="appendNumber('8')">8<span class="text-[9px] text-neutral-500 mt-0.5 tracking-widest uppercase font-semibold">TUV</span></button>
                    <button class="numpad-btn bg-neutral-900 border border-neutral-800 text-white text-3xl font-medium rounded-2xl aspect-square flex flex-col items-center justify-center hover:bg-neutral-800 hover:border-neutral-700 transition-all active:scale-95" onclick="appendNumber('9')">9<span class="text-[9px] text-neutral-500 mt-0.5 tracking-widest uppercase font-semibold">WXYZ</span></button>
                    <div></div>
                    <button class="numpad-btn bg-neutral-900 border border-neutral-800 text-white text-3xl font-medium rounded-2xl aspect-square flex flex-col items-center justify-center hover:bg-neutral-800 hover:border-neutral-700 transition-all active:scale-95" onclick="appendNumber('0')">0</button>
                    <button class="numpad-btn text-neutral-500 text-3xl aspect-square rounded-2xl flex items-center justify-center hover:bg-red-950 hover:text-red-500 transition-colors active:scale-95" onclick="deleteNumber()">
                        <i class="ph-fill ph-backspace"></i>
                    </button>
                </div>

                <!-- Call Action -->
                <button id="make-call-btn" class="w-full h-16 rounded-2xl bg-emerald-600 hover:bg-emerald-500 text-white flex items-center justify-center gap-3 shadow-[0_0_15px_rgba(16,185,129,0.2)] active:scale-95 transition-all text-xl font-bold group">
                    <i class="ph-fill ph-phone group-hover:rotate-12 transition-transform"></i> Call
                </button>
            </div>
        </div>

        <div id="call-view" class="absolute inset-0 bg-black z-10 flex flex-col hidden opacity-0 transition-all duration-500 transform scale-95 overflow-hidden">
            
            <!-- Audio Unmute Fallback Banner -->
            <button id="audio-unlock-banner" class="hidden absolute top-20 left-1/2 transform -translate-x-1/2 z-40 bg-amber-500 hover:bg-amber-400 text-black font-bold px-6 py-3 rounded-full shadow-2xl flex items-center gap-3 animate-bounce transition-all">
                <i class="ph-fill ph-speaker-high text-2xl"></i>
                <span>Tap to Enable Call Audio</span>
            </button>

            <!-- Floating Timer -->
            <div class="absolute top-6 left-1/2 transform -translate-x-1/2 z-30">
                <div id="call-timer-container" class="bg-neutral-900/80 backdrop-blur-md border border-neutral-800/50 text-neutral-300 px-5 py-2 rounded-full font-mono text-base flex items-center gap-3 hidden shadow-[0_10px_20px_rgba(0,0,0,0.3)] transition-all">
                    <div class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></div>
                    <span id="call-timer">00:00</span>
                </div>
            </div>

            <!-- Video Container -->
            <div id="video-container" class="absolute inset-0 z-0 opacity-0 pointer-events-none bg-neutral-950 transition-opacity duration-500">
                <video id="remote-video" class="w-full h-full object-cover" autoplay playsinline></video>
                <!-- Local Video PiP -->
                <div class="absolute top-20 right-4 md:top-6 md:right-6 w-28 md:w-48 aspect-[3/4] bg-neutral-900 rounded-2xl border-2 border-neutral-800 shadow-2xl overflow-hidden z-10 transition-all">
                    <video id="local-video" class="w-full h-full object-cover transform scale-x-[-1]" autoplay playsinline muted></video>
                </div>
            </div>

            <!-- Audio-only UI (Avatar, Name) -->
            <div id="audio-call-ui" class="flex-1 flex flex-col items-center justify-center relative z-10 px-6 transition-opacity duration-300">
                <!-- Avatar & Animation -->
                <div class="relative mb-12">
                    <div id="avatar-container" class="w-36 h-36 rounded-full bg-neutral-900 border-4 border-neutral-800 flex items-center justify-center relative z-10 transition-all duration-500">
                        <i class="ph-fill ph-user text-6xl text-neutral-600"></i>
                    </div>
                </div>

                <!-- Status & Name -->
                <div class="text-center mb-16">
                    <p id="call-status-text" class="text-emerald-500 font-bold text-sm uppercase tracking-[0.2em] mb-4">Connecting...</p>
                    <h2 id="call-remote-number" class="text-5xl md:text-6xl font-extrabold text-white mb-6 tracking-tight drop-shadow-lg">123 456</h2>
                </div>
            </div>

            <!-- Call Controls (Action Bar) -->
            <div class="absolute bottom-8 left-1/2 transform -translate-x-1/2 bg-neutral-900/90 backdrop-blur-xl border border-neutral-800/50 p-4 md:p-5 rounded-[2.5rem] shadow-[0_20px_50px_rgba(0,0,0,0.5)] flex items-center gap-3 md:gap-5 z-20 w-max">
                
                <!-- Answer (Incoming only) -->
                <button id="answer-btn" class="w-14 h-14 md:w-16 md:h-16 rounded-full bg-emerald-600 text-white flex items-center justify-center hidden hover:bg-emerald-500 transition-all shadow-[0_0_15px_rgba(16,185,129,0.3)] hover:scale-110 active:scale-95" title="Answer Call">
                    <i class="ph-fill ph-phone text-3xl animate-bounce"></i>
                </button>

                <!-- Send to Voicemail (Incoming only) -->
                <button id="to-voicemail-btn" class="w-14 h-14 md:w-16 md:h-16 rounded-full bg-amber-600 text-white flex items-center justify-center hidden hover:bg-amber-500 transition-all shadow-[0_0_15px_rgba(245,158,11,0.3)] hover:scale-110 active:scale-95" title="Send to Voicemail">
                    <i class="ph-fill ph-voicemail text-3xl"></i>
                </button>

                <!-- Mute -->
                <button id="mute-btn" class="w-14 h-14 md:w-16 md:h-16 rounded-2xl bg-neutral-800/80 text-white hover:bg-neutral-700 flex flex-col items-center justify-center transition-all hidden tooltip active:scale-95" title="Mute Microphone">
                    <i id="mute-icon" class="ph-fill ph-microphone text-2xl"></i>
                </button>
                
                <!-- Camera Toggle -->
                <button id="camera-btn" class="w-14 h-14 md:w-16 md:h-16 rounded-2xl bg-neutral-800/80 text-white hover:bg-neutral-700 flex flex-col items-center justify-center transition-all hidden tooltip active:scale-95" title="Toggle Camera">
                    <i id="camera-icon" class="ph-fill ph-video-camera-slash text-2xl"></i>
                </button>

                <!-- Screen Share Toggle -->
                <button id="screen-btn" class="w-14 h-14 md:w-16 md:h-16 rounded-2xl bg-neutral-800/80 text-white hover:bg-neutral-700 flex flex-col items-center justify-center transition-all hidden tooltip active:scale-95 hidden md:flex" title="Share Screen">
                    <i id="screen-icon" class="ph-bold ph-screencast text-2xl"></i>
                </button>

                <!-- Hangup -->
                <button id="hangup-btn" class="w-14 h-14 md:w-16 md:h-16 rounded-full bg-red-600 text-white flex items-center justify-center shadow-[0_0_15px_rgba(220,38,38,0.3)] hover:bg-red-500 transition-all tooltip hover:scale-110 active:scale-95" title="End Call">
                    <i class="ph-fill ph-phone-disconnect text-3xl"></i>
                </button>
            </div>
        </div>
        
        <!-- Toast Notification Container -->
        <div id="toast-container" class="fixed top-5 right-5 z-[100] flex flex-col gap-3 pointer-events-none"></div>

    </main>

    <script>
        // --- CONSTANTS & STATE ---
        const PEER_PREFIX = 'webphone-v2-'; 
        let myNumber = "";
        let myProfile = { name: "Guest User", number: "" };
        let peer = null;
        let localStream = null;
        let dummyVideoTrack = null;
        let currentCall = null;
        let isMuted = false;
        
        let callTimerInterval = null;

        // --- STREAMING_CHUNK: Setup & WebRTC Init ---
        
        // Lazy-load media access on explicit user interaction
        async function ensureMediaAccess() {
            if (!audioInitialized) {
                try {

            if (!localStream) {

                    canvas.width = 2; 
                    canvas.height = 2;
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = '#000000';
                    ctx.fillRect(0, 0, 2, 2);
                    const dummyStream = canvas.captureStream(1); 
                    dummyVideoTrack = dummyStream.getVideoTracks()[0];
                    localStream.addTrack(dummyVideoTrack);
                } catch(e) {

        function initNetwork() {

        function getContactName(numberStr) {

        // --- STREAMING_CHUNK: Audio Feedback (Tone.js) ---
        function initToneJS() {
            if (audioInitialized) return;
            
            // Standard Synth definitions
            ringToneSynth = new Tone.PolySynth(Tone.Synth, {
                oscillator: { type: "sine" },
                envelope: { attack: 0.1, decay: 0.1, sustain: 1, release: 0.1 }
            }).toDestination();
            ringToneSynth.volume.value = -12;

            audioInitialized = true;
        }

        function playRingbackTone() {
            if(!audioInitialized) return;
            Tone.Transport.stop(); Tone.Transport.cancel();
            
            // Standard US Ringback cadence (2s on, 4s off)
            Tone.Transport.scheduleRepeat(() => {
                ringToneSynth.triggerAttackRelease(["440", "480"], 2);
            }, 6); 
            Tone.Transport.start();
        }

        function playIncomingRingtone() {
            if(!audioInitialized) return;
            Tone.Transport.stop(); Tone.Transport.cancel();
            
            // Modern, pleasant marimba-like ringing
            const ringSynth = new Tone.FMSynth({
                modulationIndex: 2.5,
                envelope: { attack: 0.01, decay: 0.2, sustain: 0.2, release: 0.5 },
                modulationEnvelope: { attack: 0.1, decay: 0.1, sustain: 0.1, release: 0.1 }
            }).toDestination();
            ringSynth.volume.value = -8;

            Tone.Transport.scheduleRepeat((time) => {
                ringSynth.triggerAttackRelease("E5", "16n", time);
                ringSynth.triggerAttackRelease("A5", "16n", time + 0.15);
                ringSynth.triggerAttackRelease("E5", "16n", time + 0.3);
                ringSynth.triggerAttackRelease("C6", "16n", time + 0.45);
            }, 2);
            Tone.Transport.start();
        }

        function stopAudioTones() {
            if(Tone.Transport.state === "started") {
                Tone.Transport.stop();
                Tone.Transport.cancel();
            }
        }


        // --- STREAMING_CHUNK: Call Handlers ---
        
        els.makeCallBtn.addEventListener('click', initiateCall);
        els.hangupBtn.addEventListener('click', endCall);
        els.muteBtn.addEventListener('click', toggleMute);

        els.cameraBtn.addEventListener('click', toggleCamera);
        els.screenBtn.addEventListener('click', toggleScreenShare);

        async function initiateCall() {
            const targetNum = els.dialInput.value.replace(/\s/g, '');
            if (targetNum.length !== 6) {
                showToast("Enter a 6-digit number to call.");
                return;
            }
            if (targetNum === myNumber) {
                showToast("Cannot call your own number.");
                return;
            }

            try {
                await ensureMediaAccess();
                // Pre-warm the media element during a user gesture to bypass strict autoplay policies
                els.remoteVideo.play().catch(e => console.log("Pre-play bypassed"));
            } catch (e) {
                return; // Mic access failed/denied
            }

            const targetPeerId = PEER_PREFIX + targetNum;
            showCallScreen(targetNum, "Calling...", true);
            
            playRingbackTone();

            // Pass our profile metadata so the receiver can auto-add us to their contacts
            currentCall = peer.call(targetPeerId, localStream, { metadata: { profile: myProfile } });
            
            if(!currentCall) {
                endCall();
                showToast("Call failed initialization.");
                return;
            }

            setupCallEvents(currentCall);
        }

        function handleIncomingCall(call) {
            if (currentCall) {
                call.close(); // Busy
                return;
            }

            // Play ringtone (might be blocked silently by browser if no user gesture has occurred yet, which is normal)
            if(!audioInitialized) {
                Tone.start().then(initToneJS).then(playIncomingRingtone).catch(e => console.log("Audio block: user gesture required"));
            } else {
                playIncomingRingtone();
            }

            currentCall = call;
            const callerNum = call.peer.replace(PEER_PREFIX, '');
            const contactName = getContactName(callerNum);
            
            // Trigger Browser Notification
            if ("Notification" in window && Notification.permission === "granted") {
                new Notification("CommWeb Call", {
                    body: `Incoming call from ${contactName !== callerNum ? contactName : (callerNum.substring(0,3) + ' ' + callerNum.substring(3,6))}`,
                    icon: "https://unpkg.com/@phosphor-icons/core@2.0.1/assets/fill/phone-call-fill.svg"
                });
            }

            // Start 30s Voicemail Timer
            clearTimeout(autoAnswerTimeout);
            autoAnswerTimeout = setTimeout(() => {
                autoAnswerVoicemail(call, callerNum);
            }, 20000); // Reduced to 20s for quicker automated fallback

            // Instantly auto-add caller to our contacts if they provided profile metadata
            if (call.metadata && call.metadata.profile) {
                addOrUpdateContact(call.metadata.profile.number, call.metadata.profile.name);
            }

            showCallScreen(callerNum, "Incoming Call", false);
            
            els.toVoicemailBtn.onclick = () => {
                autoAnswerVoicemail(call, callerNum);
            };

            els.answerBtn.onclick = async () => {
                stopAudioTones();
                clearTimeout(autoAnswerTimeout);
                
                try {
                    await ensureMediaAccess();
                    // Pre-warm the media element during a user gesture to bypass strict autoplay policies
                    els.remoteVideo.play().catch(e => console.log("Pre-play bypassed"));
                } catch(e) {
                    endCall();
                    return;
                }

                els.answerBtn.classList.add('hidden');
                els.toVoicemailBtn.classList.add('hidden');
                els.callStatusText.innerText = "Connecting...";
                els.avatarContainer.classList.remove('animate-radar');
                els.avatarContainer.classList.remove('border-emerald-500', 'shadow-[0_0_30px_rgba(16,185,129,0.3)]');
                
                call.answer(localStream);
                setupCallEvents(call);
                
                // Establish a rapid data connection back to the caller to give them our profile
                const conn = peer.connect(call.peer);
                conn.on('open', () => {
                    conn.send({ type: 'PROFILE_EXCHANGE', profile: myProfile });
                    setTimeout(() => conn.close(), 2000);
                });
            };
        }

        function setupCallEvents(call) {
            call.on('stream', (remoteStream) => {
                stopAudioTones();
                
                // Ensure all incoming audio tracks are enabled
                remoteStream.getAudioTracks().forEach(track => {
                    track.enabled = true;
                });

                // Assign stream to dedicated audio element for high reliability
                if (els.remoteAudio.srcObject !== remoteStream) {
                    els.remoteAudio.srcObject = remoteStream;
                    els.remoteAudio.volume = 1.0;
                    
                    const playPromise = els.remoteAudio.play();
                    if (playPromise !== undefined) {
                        playPromise.catch(err => {
                            console.warn("Autoplay blocked remote audio:", err);
                            showAudioUnlockBanner();
                        });
                    }
                }

                // Also assign to video element for video feeds
                if (els.remoteVideo.srcObject !== remoteStream) {
                    els.remoteVideo.srcObject = remoteStream;
                    els.remoteVideo.play().catch(() => {});
                }
                
                voicemailStream = remoteStream;

                // Monitor for track swaps (dummy to real video) using the resize event
                els.remoteVideo.removeEventListener('resize', checkVideoUI);
                els.remoteVideo.addEventListener('resize', checkVideoUI);
                
                // Monitor track additions and state changes for video UI
                remoteStream.getVideoTracks().forEach(track => {
                    track.onunmute = checkVideoUI;
                    track.onmute = checkVideoUI;
                });
                
                remoteStream.onaddtrack = (e) => {
                    if (e.track.kind === 'video') {
                        e.track.onunmute = checkVideoUI;
                        e.track.onmute = checkVideoUI;
                        checkVideoUI();
                    }
                };
                
                // Update UI connected state
                els.callStatusText.innerText = "Connected";
                els.callStatusText.classList.replace('text-emerald-500', 'text-blue-400');
                
                els.avatarContainer.classList.remove('animate-radar', 'animate-ringing');
                els.avatarContainer.classList.add('border-blue-500', 'shadow-[0_0_40px_rgba(59,130,246,0.2)]');
                els.avatarContainer.querySelector('i').classList.replace('text-neutral-600', 'text-blue-400');
                
                els.answerBtn.classList.add('hidden');
                els.muteBtn.classList.remove('hidden');
                els.cameraBtn.classList.remove('hidden');
                
                // Show screen share conditionally
                if (window.innerWidth >= 768) {
                    els.screenBtn.classList.remove('hidden');
                    els.screenBtn.classList.add('md:flex');
                }
                
                startTimer();
                startAudioVisualizer(remoteStream);
                checkVideoUI();
            });

            call.on('close', endCall);
            call.on('error', endCall);
        }

        function showAudioUnlockBanner() {
            if (els.audioUnlockBanner) {
                els.audioUnlockBanner.classList.remove('hidden');
            }
        }

        if (els.audioUnlockBanner) {
            els.audioUnlockBanner.addEventListener('click', () => {
                if (els.remoteAudio) {
                    els.remoteAudio.play().then(() => {
                        els.audioUnlockBanner.classList.add('hidden');
                        showToast("Audio enabled!", "success");
                    }).catch(err => {
                        console.error("Manual audio play failed:", err);
                    });
                }
            });
        }

        async function autoAnswerVoicemail(call, callerNum) {
            stopAudioTones();
            clearTimeout(autoAnswerTimeout);
            
            els.callStatusText.innerText = "Greeting...";
            els.callStatusText.classList.replace('text-emerald-500', 'text-amber-400');
            els.answerBtn.classList.add('hidden');
            els.toVoicemailBtn.classList.add('hidden');
            els.avatarContainer.classList.remove('animate-radar');
            els.avatarContainer.classList.add('border-amber-500', 'shadow-[0_0_40px_rgba(245,158,11,0.3)]');
            els.avatarContainer.querySelector('i').classList.replace('text-emerald-400', 'text-amber-400');

            try {
                // Generate a greeting beep to send to the caller using Web Audio API
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                const actx = new AudioCtx();
                
                if (actx.state === 'suspended') {
                    await actx.resume().catch(e => console.warn("AudioContext resume failed:", e));
                }
                
                const dest = actx.createMediaStreamDestination();
                
                const vmStream = new MediaStream();
                vmStream.addTrack(dest.stream.getAudioTracks()[0]);
                if (dummyVideoTrack) vmStream.addTrack(dummyVideoTrack);

                call.answer(vmStream);
                setupCallEvents(call);
                
                // Give connection a moment, then play greeting
                setTimeout(() => {
                    // Play text-to-speech prompt locally
                    const utterance = new SpeechSynthesisUtterance("Please leave your message at the beep.");
                    
                    let transitionDone = false;
                    const playBeepAndRecord = () => {
                        if (transitionDone) return;
                        transitionDone = true;

                        els.callStatusText.innerText = "Recording Voicemail...";
                        els.callStatusText.classList.replace('text-amber-400', 'text-red-400');
                        els.avatarContainer.classList.replace('border-amber-500', 'border-red-500');
                        els.avatarContainer.classList.replace('shadow-[0_0_40px_rgba(245,158,11,0.3)]', 'shadow-[0_0_40px_rgba(239,68,68,0.3)]');
                        els.avatarContainer.querySelector('i').classList.replace('text-amber-400', 'text-red-400');
                        els.avatarContainer.classList.add('animate-pulse');

                        const osc = actx.createOscillator();
                        osc.type = 'sine';
                        osc.frequency.value = 880; // Beep pitch
                        osc.connect(dest);
                        
                        // Play beep for 1 second over WebRTC
                        osc.start();
                        setTimeout(() => { 
                            osc.stop();
                            startRecording(call.peer.replace(PEER_PREFIX, ''));
                            startTimer();
                        }, 1000);
                    };

                    utterance.onend = playBeepAndRecord;
                    window.speechSynthesis.speak(utterance);
                    
                    // Fallback in case speech synthesis fails or is blocked
                    setTimeout(playBeepAndRecord, 4000);
                }, 500);

                // Hard limit voicemail to 2 minutes
                setTimeout(() => { if (isRecordingVoicemail) endCall(); }, 120000); 

            } catch (err) {
                console.error("Failed to auto-answer:", err);
                endCall();
            }
        }

        function startRecording(callerNum) {
            if (!voicemailStream) {
                // Wait for caller's stream to arrive if it hasn't yet (Race condition fix)
                console.warn("Stream not ready for recording, retrying...");
                setTimeout(() => startRecording(callerNum), 500);
                return;
            }
            isRecordingVoicemail = true;
            voicemailChunks = [];
            try {
                // Ensure we only record audio to prevent playback issues
                const audioTracks = voicemailStream.getAudioTracks();
                if (audioTracks.length === 0) throw new Error("No audio track in remote stream");
                
                const streamToRecord = new MediaStream([audioTracks[0]]);
                const recorder = new MediaRecorder(streamToRecord);
                activeMediaRecorder = recorder;
                
                // Collect data continuously
                recorder.ondataavailable = e => {
                    if (e.data.size > 0) voicemailChunks.push(e.data);
                };
                
                recorder.onstop = () => {
                    if (voicemailChunks.length > 0) {
                        const mimeType = recorder.mimeType || 'audio/webm';
                        const blob = new Blob(voicemailChunks, { type: mimeType });
                        const url = URL.createObjectURL(blob);
                        saveVoicemail(callerNum, url);
                    }
                };
                
                // Record in 1-second chunks for data reliability
                recorder.start(1000); 
            } catch (err) {
                console.error("Failed to start MediaRecorder for voicemail:", err);
            }
        }

        function endCall() {
            clearTimeout(autoAnswerTimeout);
            
            if (els.audioUnlockBanner) {
                els.audioUnlockBanner.classList.add('hidden');
            }

            // Stop Voicemail recording if active
            if (activeMediaRecorder && activeMediaRecorder.state !== 'inactive') {
                activeMediaRecorder.stop();
                activeMediaRecorder = null;
            }
            isRecordingVoicemail = false;
            voicemailStream = null;

            if (currentCall) {
                currentCall.close();
                currentCall = null;
            }
            
            stopAudioTones();
            stopTimer();
            stopAudioVisualizer();
            
            if(isMuted) toggleMute();
            
            // Clean up video/audio streams
            if (localVideoStream) stopCamera();
            if (localScreenStream) stopScreenShare();
            els.remoteVideo.srcObject = null;
            els.remoteAudio.srcObject = null;
            checkVideoUI();
            
            // Hide action buttons
            els.cameraBtn.classList.add('hidden');
            els.screenBtn.classList.add('hidden');
            els.screenBtn.classList.remove('md:flex');
            
            // Switch UI back to dialer
            els.callView.classList.add('opacity-0');
            setTimeout(() => {
                els.callView.classList.add('hidden');
                els.dialerView.classList.remove('hidden', 'opacity-0');
            }, 300);

            els.hangupBtn.onclick = endCall;
        }

        function toggleMute() {
            if (!localStream) return;
            isMuted = !isMuted;
            
            localStream.getAudioTracks().forEach(track => track.enabled = !isMuted);

            if (isMuted) {
                els.muteBtn.classList.replace('bg-neutral-800', 'bg-amber-600');
                els.muteBtn.classList.replace('hover:bg-neutral-700', 'hover:bg-amber-500');
                els.muteBtn.classList.add('shadow-[0_0_15px_rgba(217,119,6,0.3)]');
                els.muteIcon.classList.replace('ph-microphone', 'ph-microphone-slash');
            } else {
                els.muteBtn.classList.replace('bg-amber-600', 'bg-neutral-800');
                els.muteBtn.classList.replace('hover:bg-amber-500', 'hover:bg-neutral-700');
                els.muteBtn.classList.remove('shadow-[0_0_15px_rgba(217,119,6,0.3)]');
                els.muteIcon.classList.replace('ph-microphone-slash', 'ph-microphone');
            }
        }

        let localVideoStream = null;
        let localScreenStream = null;

        async function toggleCamera() {
            if (!localVideoStream) {
                try {
                    localVideoStream = await navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 1280 }, height: { ideal: 720 } } });
                    const videoTrack = localVideoStream.getVideoTracks()[0];
                    
                    videoTrack.onended = () => stopCamera();

                    els.localVideo.srcObject = localVideoStream;
                    // Mirror effect for front facing camera
                    els.localVideo.classList.add('scale-x-[-1]'); 
                    
                    if (localScreenStream) stopScreenShare();

                    if (currentCall && currentCall.peerConnection) {
                        const sender = currentCall.peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
                        if (sender) {
                            sender.replaceTrack(videoTrack);
                        }
                    }
                    
                    els.cameraBtn.classList.replace('bg-neutral-800/80', 'bg-blue-600');
                    els.cameraBtn.classList.replace('hover:bg-neutral-700', 'hover:bg-blue-500');
                    els.cameraIcon.classList.replace('ph-video-camera-slash', 'ph-video-camera');
                    checkVideoUI();
                } catch(err) {
                    console.error(err);
                    showToast("Camera access denied.");
                }
            } else {
                stopCamera();
            }
        }

        function stopCamera() {
            if (localVideoStream) {
                localVideoStream.getTracks().forEach(t => t.stop());
                localVideoStream = null;
            }
            if (currentCall && currentCall.peerConnection && dummyVideoTrack) {
                const sender = currentCall.peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
                if (sender) {
                    sender.replaceTrack(dummyVideoTrack);
                }
            }
            
            if (!localScreenStream) els.localVideo.srcObject = null;
            
            els.cameraBtn.classList.replace('bg-blue-600', 'bg-neutral-800/80');
            els.cameraBtn.classList.replace('hover:bg-blue-500', 'hover:bg-neutral-700');
            els.cameraIcon.classList.replace('ph-video-camera', 'ph-video-camera-slash');
            checkVideoUI();
        }

        async function toggleScreenShare() {
            if (!localScreenStream) {
                try {
                    localScreenStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: false });
                    const screenTrack = localScreenStream.getVideoTracks()[0];
                    
                    screenTrack.onended = () => stopScreenShare();

                    els.localVideo.srcObject = localScreenStream;
                    // Remove mirror effect for screen sharing
                    els.localVideo.classList.remove('scale-x-[-1]'); 
                    
                    if (localVideoStream) stopCamera();

                    if (currentCall && currentCall.peerConnection) {
                        const sender = currentCall.peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
                        if (sender) {
                            sender.replaceTrack(screenTrack);
                        }
                    }
                    
                    els.screenBtn.classList.replace('bg-neutral-800/80', 'bg-purple-600');
                    els.screenBtn.classList.replace('hover:bg-neutral-700', 'hover:bg-purple-500');
                    checkVideoUI();
                } catch(err) {
                    console.error(err);
                    showToast("Screen sharing failed (may be restricted in this view).", "error");
                }
            } else {
                stopScreenShare();
            }
        }

        function stopScreenShare() {
            if (localScreenStream) {
                localScreenStream.getTracks().forEach(t => t.stop());
                localScreenStream = null;
            }
            
            // Re-apply mirror class in case camera is used next
            els.localVideo.classList.add('scale-x-[-1]');
            
            if (currentCall && currentCall.peerConnection && dummyVideoTrack) {
                const sender = currentCall.peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
                if (sender) {
                    sender.replaceTrack(dummyVideoTrack);
                }
            }
            
            if (!localVideoStream) els.localVideo.srcObject = null;
            
            els.screenBtn.classList.replace('bg-purple-600', 'bg-neutral-800/80');
            els.screenBtn.classList.replace('hover:bg-purple-500', 'hover:bg-neutral-700');
            checkVideoUI();
        }

        function checkVideoUI() {
            const remoteStream = els.remoteVideo.srcObject;
            let hasRemoteVideo = false;
            
            // Because we use a 2x2 dummy track, real video tracks will have a larger width
            if (remoteStream && els.remoteVideo.videoWidth > 2) {
                hasRemoteVideo = true;
            }
            
            const hasLocalVideo = !!(localVideoStream || localScreenStream);
            
            if (!hasRemoteVideo && !hasLocalVideo) {
                els.videoContainer.classList.add('opacity-0', 'pointer-events-none');
                els.audioCallUi.classList.remove('opacity-0', 'pointer-events-none');
            } else {
                els.videoContainer.classList.remove('opacity-0', 'pointer-events-none');
                els.audioCallUi.classList.add('opacity-0', 'pointer-events-none');
            }
        }

        // --- STREAMING_CHUNK: View Helpers & Timer ---
        function showCallScreen(number, status, isOutgoing) {
            // Swap Views with animation
            els.dialerView.classList.add('scale-95', 'opacity-0', 'pointer-events-none');
            setTimeout(() => els.dialerView.classList.add('hidden'), 500);
            
            els.callView.classList.remove('hidden');
            // small delay for transition effect
            setTimeout(() => {
                els.callView.classList.remove('opacity-0', 'scale-95');
                els.callView.classList.add('opacity-100', 'scale-100');
            }, 50);
            
            const contactName = getContactName(number);
            els.callRemoteNumber.innerText = contactName !== number 
                ? contactName 
                : `${number.substring(0,3)} ${number.substring(3,6)}`;
                
            els.callStatusText.innerText = status;
            els.callStatusText.className = "font-bold text-sm uppercase tracking-[0.2em] mb-4 text-emerald-500";
            els.callTimerContainer.classList.add('hidden');
            
            // Reset Avatar styling
            els.avatarContainer.className = "w-36 h-36 rounded-full bg-neutral-900 border-4 border-neutral-800 flex items-center justify-center relative z-10 transition-all duration-500";
            els.avatarContainer.querySelector('i').className = "ph-fill ph-user text-6xl text-neutral-600 transition-colors";
            
            els.muteBtn.classList.add('hidden');
            els.cameraBtn.classList.add('hidden');
            els.screenBtn.classList.add('hidden');
            els.screenBtn.classList.remove('md:flex');

            if (isOutgoing) {
                els.answerBtn.classList.add('hidden');
                els.toVoicemailBtn.classList.add('hidden');
                // Simulate a ringing outgoing state visually
                els.avatarContainer.classList.add('border-blue-500', 'animate-ringing');
            } else {
                els.answerBtn.classList.remove('hidden');
                els.toVoicemailBtn.classList.remove('hidden');
                els.avatarContainer.classList.add('animate-radar', 'border-emerald-500', 'shadow-[0_0_30px_rgba(16,185,129,0.3)]'); // Radar effect for incoming
                els.avatarContainer.querySelector('i').classList.replace('text-neutral-600', 'text-emerald-400');
            }
        }

        function startTimer() {
            els.callTimerContainer.classList.remove('hidden');
            callSeconds = 0;
            updateTimerDisplay();
            
            if(callTimerInterval) clearInterval(callTimerInterval);
            callTimerInterval = setInterval(() => {
                callSeconds++;
                updateTimerDisplay();
            }, 1000);
        }

        function stopTimer() {
            if(callTimerInterval) clearInterval(callTimerInterval);
            els.callTimerContainer.classList.add('hidden');
        }

        function updateTimerDisplay() {
            const m = Math.floor(callSeconds / 60).toString().padStart(2, '0');
            const s = (callSeconds % 60).toString().padStart(2, '0');
            els.callTimer.innerText = `${m}:${s}`;
        }

        // --- STREAMING_CHUNK: Voicemail UI Handlers ---
        function saveVoicemail(number, audioUrl) {
            voicemails.push({
                id: Date.now(),
                number: number,
                url: audioUrl,
                date: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) + ' - ' + new Date().toLocaleDateString(),
                read: false
            });
            updateVoicemailUI();
            
            if ("Notification" in window && Notification.permission === "granted") {
                new Notification("New Voicemail", {
                    body: `You received a new voicemail from ${getContactName(number)}.`,
                    icon: "https://unpkg.com/@phosphor-icons/core@2.0.1/assets/fill/voicemail-fill.svg"
                });
            } else {
                showToast("New voicemail received!", "success");
            }
        }

        function updateVoicemailUI() {
            const unreadCount = voicemails.filter(v => !v.read).length;
            if (unreadCount > 0) {
                els.voicemailBadge.classList.remove('hidden');
            } else {
                els.voicemailBadge.classList.add('hidden');
            }
            renderVoicemails();
        }

        function renderVoicemails() {
            els.voicemailsList.innerHTML = '';
            if (voicemails.length === 0) {
                els.voicemailsList.innerHTML = `
                <div class="text-center text-neutral-500 mt-12 text-sm p-8 border-2 border-dashed border-neutral-800 rounded-2xl flex flex-col items-center gap-3">
                    <div class="w-12 h-12 bg-neutral-900 rounded-full flex items-center justify-center text-neutral-400">
                        <i class="ph-fill ph-voicemail text-2xl"></i>
                    </div>
                    <div>No voicemails yet.</div>
                </div>`;
                return;
            }

            voicemails.sort((a, b) => b.id - a.id).forEach(vm => {
                const div = document.createElement('div');
                const contactName = getContactName(vm.number);
                
                div.className = `bg-neutral-950 p-4 rounded-2xl border ${vm.read ? 'border-neutral-900' : 'border-blue-900/50 shadow-[0_0_15px_rgba(59,130,246,0.1)]'} flex flex-col gap-3 transition-all`;
                
                div.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-full ${vm.read ? 'bg-neutral-900 text-neutral-500' : 'bg-blue-900/30 text-blue-400'} flex items-center justify-center">
                                <i class="ph-fill ph-user text-lg"></i>
                            </div>
                            <div>
                                <h4 class="font-bold text-white text-base flex items-center gap-2">
                                    ${contactName}
                                    ${!vm.read ? '<span class="w-2 h-2 rounded-full bg-blue-500"></span>' : ''}
                                </h4>
                                <p class="text-neutral-500 text-xs">${vm.date}</p>
                            </div>
                        </div>
                        <button onclick="deleteVoicemail(${vm.id})" class="text-neutral-600 hover:text-red-400 p-2 transition-colors" title="Delete">
                            <i class="ph-bold ph-trash"></i>
                        </button>
                    </div>
                    <audio controls src="${vm.url}" class="w-full h-10 mt-2 rounded outline-none" onplay="markVoicemailRead(${vm.id})"></audio>
                `;
                els.voicemailsList.appendChild(div);
            });
        }

        window.markVoicemailRead = function(id) {
            const vm = voicemails.find(v => v.id === id);
            if (vm && !vm.read) {
                vm.read = true;
                updateVoicemailUI();
            }
        };

        window.deleteVoicemail = function(id) {
            voicemails = voicemails.filter(v => v.id !== id);
            updateVoicemailUI();
        };

        // --- STREAMING_CHUNK: Audio Visualizer ---
        function startAudioVisualizer(stream) {
            stopAudioVisualizer(); // Ensure clean state
            
            try {
                // Initialize Web Audio API
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                
                audioContext = new AudioCtx();
                const source = audioContext.createMediaStreamSource(stream);
                const analyzer = audioContext.createAnalyser();
                analyzer.fftSize = 256;
                source.connect(analyzer);
                
                const dataArray = new Uint8Array(analyzer.frequencyBinCount);
                els.avatarContainer.classList.add('audio-pulse');
                
                function draw() {
                    if (!audioContext) return;
                    visualizerAnimationFrame = requestAnimationFrame(draw);
                    analyzer.getByteFrequencyData(dataArray);
                    
                    let sum = 0;
                    for(let i = 0; i < dataArray.length; i++) {
                        sum += dataArray[i];
                    }
                    const average = sum / dataArray.length;
                    
                    // Map volume (0-255) to scale & glow dynamically
                    const scale = 1 + (average / 255) * 0.25;
                    els.avatarContainer.style.transform = `scale(${scale})`;
                    
                    if (average > 15) {
                        const intensity = average / 255;
                        els.avatarContainer.style.boxShadow = `0 0 ${40 + (intensity * 60)}px rgba(59,130,246, ${0.2 + intensity})`;
                        els.avatarContainer.style.borderColor = `rgba(59,130,246, ${0.5 + intensity})`;
                    } else {
                        els.avatarContainer.style.boxShadow = `0 0 40px rgba(59,130,246,0.2)`;
                        els.avatarContainer.style.borderColor = `rgb(59,130,246)`;
                    }
                }
                
                draw();
            } catch (err) {
                console.warn("Visualizer unavailable:", err);
            }
        }

        function stopAudioVisualizer() {
            if (visualizerAnimationFrame) {
                cancelAnimationFrame(visualizerAnimationFrame);
                visualizerAnimationFrame = null;
            }
            if (audioContext && audioContext.state !== 'closed') {
                audioContext.close().catch(console.error);
                audioContext = null;
            }
            els.avatarContainer.classList.remove('audio-pulse');
            els.avatarContainer.style.transform = '';
            els.avatarContainer.style.boxShadow = '';
            els.avatarContainer.style.borderColor = '';
        }

    </script>
</body>
